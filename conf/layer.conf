# We have a conf and classes directory, add to BBPATH
BBPATH .= ":${LAYERDIR}"

# We have recipes-* directories, add to BBFILES
BBFILES += "${LAYERDIR}/recipes-*/*/*.bb \
            ${LAYERDIR}/recipes-*/*/*.bbappend"

BBFILE_COLLECTIONS += "yoriito-layer"
BBFILE_PATTERN_yoriito-layer = "^${LAYERDIR}/"
BBFILE_PRIORITY_yoriito-layer = "6"

LAYERDEPENDS_yoriito-layer = "core openembedded-layer rust-bin-layer"
LAYERSERIES_COMPAT_yoriito-layer = "scarthgap"

LICENSE_PATH += "${LAYERDIR}/licenses"
YORIITO_LICENSE_PATH = "${LAYERDIR}/licenses"

require conf/distro/include/package_versions.inc
require conf/distro/include/virtual.inc
